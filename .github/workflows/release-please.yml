name: release-please

on:
  push:
    branches: ["17"]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: "Publish packages to NuGet"
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          target-branch: "17"
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-dotnet@v4
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet restore

      - name: Build (Release)
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: dotnet build -c Release --no-restore

      - name: Pack
        if: ${{ steps.rp.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          mkdir -p artifacts
          dotnet pack "Vettvangur.DictionaryHelper/DictionaryHelper.csproj" \
            -c Release --no-build -o ./artifacts

      - name: NuGet Login (OIDC)
        id: login
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: NuGet/login@v1
        with:
          user: Vettvangur

      - name: Push to NuGet.org
        if: ${{ steps.rp.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
